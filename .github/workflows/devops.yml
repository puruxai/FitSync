name: FitSync CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  quality-assurance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Linting checks
        run: npm run lint

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Dependency security scan
        run: |
          npm audit --audit-level=critical || echo "High severity advisories detected. Continuing CI."

      - name: Execute unit tests
        run: npm run test:run

      - name: Verify production builds
        run: npm run build
